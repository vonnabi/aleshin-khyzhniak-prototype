name: Deploy prototype to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Прототип не повинен потрапляти в пошук: справжній сайт буде на власному домені.
      - name: Close the prototype from search engines
        run: |
          find . -name "*.html" -not -path "./.git/*" -print0 \
            | xargs -0 sed -i 's#<head>#<head><meta name="robots" content="noindex,nofollow">#'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
